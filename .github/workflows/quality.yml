name: Booking quality gates

on:
  pull_request:
  push:
    branches: ["main", "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LUXART_MOCK: "true"
      NEXT_PUBLIC_APP_ENV: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and browser system dependencies
        run: npx playwright install --with-deps chromium

      - name: Typecheck, production build and dependency audit
        run: npm run quality

      - name: Start demo and run runtime and booking probes
        run: |
          npm run start -- --port 3007 > /tmp/zone4you-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3007/ > /dev/null; then
              break
            fi
            sleep 1
          done
          APP_BASE_URL=http://127.0.0.1:3007 npm run probe:runtime
          APP_BASE_URL=http://127.0.0.1:3007 npm run smoke:api
