name: Booking quality gates

on:
  pull_request:
  push:
    branches: ["main", "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LUXART_MOCK: "true"
      NEXT_PUBLIC_APP_ENV: demo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium, WebKit and browser system dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Typecheck, production build and dependency audit
        run: npm run quality

      - name: Start demo and run runtime and booking probes
        run: |
          npm run start -- --port 3007 > /tmp/zone4you-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3007/ > /dev/null; then
              break
            fi
            sleep 1
          done
          APP_BASE_URL=http://127.0.0.1:3007 npm run probe:runtime
          APP_BASE_URL=http://127.0.0.1:3007 npm run smoke:api

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zone4you_test
          POSTGRES_USER: zone4you_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zone4you_test -d zone4you_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOOKING_TEST_DATABASE_URL: postgresql://zone4you_test:local-ci-only@127.0.0.1:5432/zone4you_test
      PAYMENT_TEST_DATABASE_URL: postgresql://zone4you_test:local-ci-only@127.0.0.1:5432/zone4you_test
      RATE_LIMIT_TEST_DATABASE_URL: postgresql://zone4you_test:local-ci-only@127.0.0.1:5432/zone4you_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify PostgreSQL ledgers and shared limiter
        run: npm run test:postgres
